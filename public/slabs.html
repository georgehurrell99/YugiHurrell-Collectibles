<!DOCTYPE html>
<html>
<head>
  <title>Graded Slabs | YugiHurrell Collectibles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050303;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .sub {
      color: #d6a94d;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }

    .card {
      background: rgba(16,7,7,.88);
      border: 1px solid rgba(214,169,77,.25);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      transition: .25s;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 20px rgba(0,0,0,.35);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #d6a94d;
      box-shadow: 0 0 25px rgba(214,169,77,.2);
    }

    .card h2 {
      margin-top: 0;
      color: #f5efe2;
      font-size: 28px;
    }

    .card p {
      color: #a1a1aa;
      line-height: 1.6;
    }

    .grades {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      justify-content: center;
    }

    .grade {
      border: 1px solid rgba(214,169,77,.45);
      border-radius: 999px;
      padding: 8px 12px;
      color: #d6a94d;
      font-weight: bold;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-bottom: 40px;
      color: #d6a94d;
      text-decoration: none;
      font-weight: bold;
    }

    .slab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
      gap: 22px;
      margin-top: 28px;
    }

    .slab-item {
      background: #050303;
      border: 1px solid rgba(214,169,77,.25);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      transition: .25s;
    }

    .slab-item:hover {
      transform: translateY(-4px);
      border-color: #d6a94d;
      box-shadow: 0 0 25px rgba(214,169,77,.2);
    }
