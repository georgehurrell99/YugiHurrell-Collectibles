<!DOCTYPE html>
<html>
<head>
  <title>Sealed Product | YugiHurrell Collectibles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050303;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .sub {
      color: #d6a94d;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(16, 7, 7, .88);
      border: 1px solid rgba(214, 169, 77, .25);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      transition: .25s;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 20px rgba(0, 0, 0, .35);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #d6a94d;
      box-shadow: 0 0 25px rgba(214, 169, 77, .2);
    }

    .product-image {
      width: 100%;
      height: 260px;
      object-fit: contain;
      display: block;
    }

    .card h2 {
      margin-top: 16px;
      margin-bottom: 10px;
      color: #f5efe2;
      font-size: 24px;
    }

    .card p {
      color: #d6a94d;
      line-height: 1.6;
      font-weight: 600;
      margin: 6px 0;
    }

    .buy-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      background: linear-gradient(90deg, #b9822b, #e0b85c);
      color: #050303;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 14px;
      width: 100%;
      min-height: 46px;
      transition: .2s;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .buy-btn:hover {
      transform: translateY(-2px);
    }

    .sold-out {
      background: #3f3f46;
      color: #a1a1aa;
      cursor: not-allowed;
    }

    .sold-out:hover {
      transform: none;
    }

    .sold-out-text {
      color: #ef4444 !important;
      font-weight: 700;
    }

    .back {
      display: inline-block;
      margin-bottom: 40px;
      color: #d6a94d;
      text-decoration: none;
      font-weight: bold;
    }

    #loading {
      color: #d6a94d;
      font-size: 20px;
    }

    #error {
      color: #ef4444;
      font-size: 18px;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      .container {
        padding: 30px 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="back" href="/">← Back to Homepage</a>

    <h1>Sealed Product</h1>

    <p class="sub">
      Browse sealed Yu-Gi-Oh! product available from YugiHurrell Collectibles.
    </p>

    <div id="loading">Loading products...</div>

    <div id="error"></div>

    <div class="grid" id="product-grid"></div>

  </div>

  <script>

    async function loadProducts() {

      const grid = document.getElementById("product-grid");
      const loading = document.getElementById("loading");
      const error = document.getElementById("error");

      try {

        const response = await fetch("/api/products");

        if (!response.ok) {
          throw new Error("Unable to load products");
        }

        const data = await response.json();

        loading.style.display = "none";

        const products = data.products;

        products.forEach(product => {

          const variant = product.variants[0];

          const price = Number(variant.price).toFixed(2);

          const stock = variant.inventory_quantity;

          let image =
            product.image?.src ||
            "https://via.placeholder.com/300x300?text=No+Image";

          /*
            Custom image for Magnificent Monsters Tuckbox.
            This uses MAMOSEALED.png from the public folder.
          */
          if (product.handle === "magnificent-monsters-tuckbox") {
            image = "/MAMOSEALED.png";
          }

          const card = document.createElement("div");

          card.className = "card";

          if (stock > 0) {

            card.innerHTML = `
              <img
                class="product-image"
                src="${image}"
                alt="${product.title}"
              >

              <h2>${product.title}</h2>

              <p>£${price}</p>

              <p>${stock} In Stock</p>

              <a
                class="buy-btn"
                href="https://cttn1c-aj.myshopify.com/cart/${variant.id}:1"
              >
                Buy Now
              </a>
            `;

          } else {

            card.innerHTML = `
              <img
                class="product-image"
                src="${image}"
                alt="${product.title}"
              >

              <h2>${product.title}</h2>

              <p>£${price}</p>

              <p class="sold-out-text">Sold Out</p>

              <button
                class="buy-btn sold-out"
                disabled
              >
                Sold Out
              </button>
            `;

          }

          grid.appendChild(card);

        });

      } catch (err) {

        loading.style.display = "none";

        error.textContent =
          "Unable to load products. Please try again later.";

        console.error(err);

      }

    }

    loadProducts();

  </script>

</body>
</html>
