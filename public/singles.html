<!DOCTYPE html>
<html>
<head>

  <title>Single Cards | YugiHurrell Collectibles</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050303;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 40px;
      color: #d6a94d;
      text-decoration: none;
      font-weight: bold;
    }

    .back:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .sub {
      color: #d6a94d;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(16, 7, 7, .88);
      border: 1px solid rgba(214, 169, 77, .25);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      transition: .25s;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 20px rgba(0, 0, 0, .35);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #d6a94d;
      box-shadow: 0 0 25px rgba(214, 169, 77, .2);
    }

    /* Image area */

    .image-container {
      width: 100%;
      height: 300px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image {
      width: 100%;
      height: 300px;
      object-fit: contain;
      display: block;
    }

    /* Front / Back buttons */

    .image-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .image-btn {
      background: transparent;
      color: #d6a94d;
      border: 1px solid rgba(214, 169, 77, .4);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .image-btn:hover {
      border-color: #d6a94d;
      background: rgba(214, 169, 77, .12);
    }

    .image-btn.active {
      background: #d6a94d;
      color: #050303;
      border-color: #d6a94d;
    }

    .card h2 {
      margin-top: 16px;
      margin-bottom: 10px;
      color: #f5efe2;
      font-size: 22px;
      line-height: 1.3;
    }

    .card p {
      color: #d6a94d;
      line-height: 1.6;
      font-weight: 600;
      margin: 6px 0;
    }

    .buy-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;

      background: linear-gradient(
        90deg,
        #b9822b,
        #e0b85c
      );

      color: #050303;
      font-weight: 700;

      padding: 12px 16px;
      border-radius: 10px;

      margin-top: 14px;
      width: 100%;
      min-height: 46px;

      transition: .2s;
      text-decoration: none;

      border: none;
      cursor: pointer;

      font-size: 16px;
    }

    .buy-btn:hover {
      transform: translateY(-2px);
    }

    .sold-out {
      background: #3f3f46;
      color: #a1a1aa;
      cursor: not-allowed;
    }

    .sold-out:hover {
      transform: none;
    }

    .sold-out-text {
      color: #ef4444 !important;
      font-weight: 700;
    }

    #loading {
      color: #d6a94d;
      font-size: 20px;
      margin-bottom: 20px;
    }

    #error {
      color: #ef4444;
      font-size: 18px;
      margin-top: 10px;
    }

    .empty {
      grid-column: 1 / -1;

      padding: 40px 20px;

      text-align: center;

      background: rgba(16, 7, 7, .88);

      border: 1px solid rgba(214, 169, 77, .25);

      border-radius: 24px;

      color: #a1a1aa;

      line-height: 1.7;
    }

    .empty strong {
      color: #d6a94d;
    }

    @media (max-width: 600px) {

      h1 {
        font-size: 36px;
      }

      .container {
        padding: 30px 15px;
      }

      .product-image {
        height: 260px;
      }

      .image-container {
        height: 260px;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <a class="back" href="/">
      ← Back to Homepage
    </a>


    <h1>
      Single Cards
    </h1>


    <p class="sub">
      Browse individual Yu-Gi-Oh! cards available from
      YugiHurrell Collectibles.
    </p>


    <div id="loading">
      Loading singles...
    </div>


    <div id="error"></div>


    <div
      class="grid"
      id="product-grid"
    ></div>

  </div>


  <script>

    /*
      ============================================================
      SHOPIFY SINGLES
      ============================================================

      Only Shopify products with the exact tag:

      singles

      will appear on this page.
    */


    function hasTag(product, wantedTag) {

      const tags = Array.isArray(product.tags)

        ? product.tags

        : String(product.tags || "")
            .split(",")
            .map(tag => tag.trim());


      return tags.some(
        tag =>
          tag.toLowerCase() === wantedTag.toLowerCase()
      );

    }


    async function loadProducts() {

      const grid =
        document.getElementById("product-grid");

      const loading =
        document.getElementById("loading");

      const error =
        document.getElementById("error");


      try {

        /*
          Get products from your existing Shopify API.
        */

        const response =
          await fetch("/api/products");


        if (!response.ok) {

          throw new Error(
            "Unable to load Shopify products"
          );

        }


        const data =
          await response.json();


        loading.style.display = "none";


        /*
          ONLY SHOW PRODUCTS TAGGED "singles"
        */

        const products =
          (data.products || []).filter(
            product =>
              hasTag(product, "singles")
          );


        /*
          No singles found
        */

        if (products.length === 0) {

          grid.innerHTML = `

            <div class="empty">

              <strong>No single cards available yet.</strong>

              <br><br>

              Add your cards through Shopify and give
              each product the tag:

              <br><br>

              <strong>singles</strong>

            </div>

          `;

          return;

        }


        /*
          Display each Shopify single
        */

        products.forEach(product => {

          /*
            Use the first Shopify variant
          */

          const variant =
            product.variants?.[0];


          if (!variant) {
            return;
          }


          /*
            Price from Shopify
          */

          const price =
            Number(variant.price || 0)
              .toFixed(2);


          /*
            Shopify inventory quantity
          */

          const stock =
            Number(
              variant.inventory_quantity || 0
            );


          /*
            Get all Shopify images.

            First image = Front
            Second image = Back
          */

          const images =
            Array.isArray(product.images)
              ? product.images
                  .map(image =>
                    typeof image === "string"
                      ? image
                      : image?.src
                  )
                  .filter(Boolean)
              : [];


          /*
            Fallback to primary image if
            product.images isn't available.
          */

          if (
            images.length === 0 &&
            product.image?.src
          ) {

            images.push(
              product.image.src
            );

          }


          /*
            Final image fallback
          */

          if (images.length === 0) {

            images.push(
              "https://via.placeholder.com/300x400?text=No+Image"
            );

          }


          /*
            Give each card a unique ID so its
            Front / Back buttons only affect
            that particular product.
          */

          const uniqueId =
            "single-" +
            String(
              variant.id ||
              product.id ||
              Math.random()
            ).replace(/\D/g, "");


          /*
            Create product card
          */

          const card =
            document.createElement("div");


          card.className = "card";


          /*
            Image switcher is only shown when
            Shopify has at least two images.
          */

          const switcher =
            images.length >= 2

              ? `

                <div class="image-switcher">

                  <button
                    type="button"
                    class="image-btn active"
                    data-image="0"
                    data-target="${uniqueId}"
                  >
                    Front
                  </button>

                  <button
                    type="button"
                    class="image-btn"
                    data-image="1"
                    data-target="${uniqueId}"
                  >
                    Back
                  </button>

                </div>

              `

              : "";


          /*
            IN STOCK
          */

          if (stock > 0) {

            card.innerHTML = `

              <div class="image-container">

                <img
                  id="${uniqueId}"
                  class="product-image"
                  src="${images[0]}"
                  alt="${product.title}"
                  loading="lazy"
                >

              </div>


              ${switcher}


              <h2>
                ${product.title}
              </h2>


              <p>
                £${price}
              </p>


              <p>
                ${stock} In Stock
              </p>


              <a
                class="buy-btn"
                href="https://cttn1c-aj.myshopify.com/cart/${variant.id}:1"
              >
                Buy Now
              </a>

            `;

          }


          /*
            SOLD OUT
          */

          else {

            card.innerHTML = `

              <div class="image-container">

                <img
                  id="${uniqueId}"
                  class="product-image"
                  src="${images[0]}"
                  alt="${product.title}"
                  loading="lazy"
                >

              </div>


              ${switcher}


              <h2>
                ${product.title}
              </h2>


              <p>
                £${price}
              </p>


              <p class="sold-out-text">
                Sold Out
              </p>


              <button
                class="buy-btn sold-out"
                disabled
              >
                Sold Out
              </button>

            `;

          }


          /*
            Add card to page
          */

          grid.appendChild(card);


          /*
            Add Front / Back button functionality
          */

          if (images.length >= 2) {

            const buttons =
              card.querySelectorAll(
                ".image-btn"
              );


            const image =
              card.querySelector(
                ".product-image"
              );


            buttons.forEach(button => {

              button.addEventListener(
                "click",
                () => {

                  const imageIndex =
                    Number(
                      button.dataset.image
                    );


                  /*
                    Change displayed image
                  */

                  image.src =
                    images[imageIndex];


                  /*
                    Update active button
                  */

                  buttons.forEach(btn => {

                    btn.classList.remove(
                      "active"
                    );

                  });


                  button.classList.add(
                    "active"
                  );

                }
              );

            });

          }

        });


      }


      catch (err) {

        console.error(err);


        loading.style.display =
          "none";


        error.textContent =
          "Unable to load products. Please try again later.";

      }

    }


    /*
      Load Shopify singles when page opens
    */

    loadProducts();

  </script>

</body>

</html>
